{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .main-card {
            border-radius: 12px;
            transition: 0.3s ease-in-out;
        }

        .main-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .card-title {
            font-weight: 600;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand mb-0 h1">
        Welcome {{ request.user.username }}
    </span>
    <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
</nav>

<div class="container mt-5">

    <div class="row g-4">

        <!-- Model Comparison -->
        <div class="col-md-4">
            <a href="{% url 'comparison' %}" class="text-decoration-none">
                <div class="card main-card shadow bg-success text-white text-center p-4">
                    <h4 class="card-title">📊 Model Comparison</h4>
                    <p>View performance metrics of trained models</p>
                </div>
            </a>
        </div>

        <!-- Disease Detection -->
        <div class="col-md-4">
            <a href="{% url 'all_predict' %}" class="text-decoration-none">
                <div class="card main-card shadow bg-warning text-dark text-center p-4">
                    <h4 class="card-title">🔍 Disease Detection</h4>
                    <p>Upload CSV file to detect disease risk</p>
                </div>
            </a>
        </div>

        <!-- Best Algorithms -->
        <div class="col-md-4">
            <a href="{% url 'best_summary' %}" class="text-decoration-none">
                <div class="card main-card shadow bg-info text-white text-center p-4">
                    <h4 class="card-title">🏆 Best Algorithms</h4>
                    <p>View best performing model for each disease</p>
                </div>
            </a>
        </div>

    </div>

</div>

</body>
</html>
