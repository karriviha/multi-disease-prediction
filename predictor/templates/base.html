<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi Disease Prediction System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar {
            background-color: #1f2937;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .card {
            border-radius: 12px;
        }

        table th {
            font-weight: 600;
        }

        .table-success {
            background-color: #e6f4ea !important;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard/">Multi Disease System</a>

            <div class="ms-auto">
                <a href="/dashboard/" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
                <a href="/compare/" class="btn btn-outline-light btn-sm me-2">Comparison</a>
                
                <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
